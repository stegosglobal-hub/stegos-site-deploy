name: Build, check and deploy

# Pull requests only build + check. Pushes to main also publish ./dist to GitHub Pages
# (repo Settings -> Pages -> Source = "GitHub Actions"; domain comes from CNAME).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # generate pages -> Tailwind CSS -> GSAP -> cache stamps -> dist/
      - run: npm run build
      # broken links/anchors, SEO basics, CSP, stale stamps
      - run: npm run check
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      # Package dist/ the same way actions/upload-pages-artifact does, but WITHOUT skipping
      # dot-folders, so /.well-known/security.txt is published.
      - if: github.event_name != 'pull_request'
        name: Package site
        run: tar --dereference --hard-dereference --directory dist -cvf "$RUNNER_TEMP/artifact.tar" .
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
