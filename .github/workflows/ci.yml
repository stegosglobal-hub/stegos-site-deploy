name: Site checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Builds the site, then fails if links/anchors are broken, SEO basics are missing,
      # a script would be blocked by the CSP, or asset version stamps are stale.
      - run: npm ci
      - run: npm run build
      - run: npm run check
