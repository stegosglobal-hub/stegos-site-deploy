<!doctype html>
<!-- Source for assets/img/og-image.png (1200x630 share image). To regenerate, open this file in a
     browser at 1200x630 and screenshot it, e.g.
       msedge --headless=new --window-size=1200,630 --virtual-time-budget=6000 --screenshot=assets/img/og-image.png file:///.../scripts/og-template.html -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { width: 1200px; height: 630px; background: #fff; color: #0a1228; font-family: "Plus Jakarta Sans", Arial, sans-serif; position: relative; overflow: hidden; }
      .glow { position: absolute; width: 640px; height: 640px; right: -180px; top: -260px; border-radius: 50%; background: radial-gradient(circle, rgba(61, 105, 255, 0.2), transparent 68%); }
      .wrap { position: absolute; inset: 0; padding: 56px 72px; display: flex; flex-direction: column; justify-content: space-between; }
      .logo { font-size: 44px; font-weight: 800; font-style: italic; letter-spacing: -2.5px; line-height: 1; }
      .logo b { color: #e06400; }
      .logo small { font-size: 15px; font-weight: 600; font-style: normal; letter-spacing: 0; color: #5a6683; margin-left: 6px; vertical-align: top; }
      h1 { font-size: 92px; line-height: 0.96; font-weight: 700; letter-spacing: -4.6px; max-width: 980px; }
      h1 em { color: #e06400; font-weight: 700; }
      .row { display: flex; align-items: center; justify-content: space-between; }
      .pills { display: flex; gap: 14px; }
      .pill { padding: 12px 24px; border-radius: 999px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
      .amz { background: #ffe6c9; color: #8a4b00; }
      .fk { background: #dbe7ff; color: #1747a8; }
      .my { background: #ffdce5; color: #a3153a; }
      .stat { background: #0a1630; color: #fff; border-radius: 28px; padding: 16px 28px; display: flex; gap: 30px; }
      .stat div { font-size: 38px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
      .stat span { display: block; font-size: 14px; font-weight: 500; letter-spacing: 0; color: #a9b5d3; margin-top: 6px; }
      .stat div:nth-child(2) { color: #ff9f1a; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="wrap">
      <div class="logo">Stegos<b>.</b><small>Global</small></div>
      <h1>Turn marketplace spend into <em>predictable</em> revenue.</h1>
      <div class="row">
        <div class="pills"><span class="pill amz">Amazon Ads</span><span class="pill fk">Flipkart Ads</span><span class="pill my">Myntra Ads</span></div>
        <div class="stat"><div>₹55.2L+<span>Ad spend managed</span></div><div>4.21x<span>Avg ROAS (Amazon)</span></div></div>
      </div>
    </div>
  </body>
</html>
