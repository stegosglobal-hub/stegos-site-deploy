<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0a1630;color:#fff;font-family:"Segoe UI",Arial,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;width:560px;height:560px;border-radius:50%;background:#2750e0;opacity:.5;filter:blur(90px);right:-120px;top:-180px}
.glow2{position:absolute;width:420px;height:420px;border-radius:50%;background:#ff9f1a;opacity:.2;filter:blur(90px);left:-140px;bottom:-200px}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.logo{font-size:34px;font-weight:800;letter-spacing:-.5px}.logo span{color:#9aa1ac;font-weight:500;font-size:26px;margin-left:8px}
h1{font-size:84px;line-height:1;font-weight:800;letter-spacing:-3px;max-width:980px}
h1 em{font-style:normal;color:#ff9f1a}
.row{display:flex;gap:28px;align-items:center;font-size:24px;color:#9aa1ac}
.d{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px}
.bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#ff9900,#2874f0,#e8325a)}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="wrap"><div class="logo">Stegos<span>Global</span></div>
<h1>Turn marketplace spend into <em>predictable</em> revenue.</h1>
<div class="row"><span><i class="d" style="background:#ff9900"></i>Amazon Ads</span><span><i class="d" style="background:#2874f0"></i>Flipkart Ads</span><span><i class="d" style="background:#e8325a"></i>Myntra Ads</span></div></div>
<div class="bar"></div></body></html>
